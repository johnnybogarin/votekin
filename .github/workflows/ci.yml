name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy -p votekin-core --all-targets -- -D warnings
      - run: cargo test -p votekin-core -p votekin
      - run: cargo clippy -p votekin --target wasm32-wasip2 -- -D warnings
      - run: cargo build-plugin
